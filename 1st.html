```html
<!DOCTYPE html>
<html>
<head>
    <title>⭐ Think and Win - Set 1</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #263238;
        }

        .container {
            width: 500px;
            max-width: 95%;
            margin: 20px auto;
            text-align: center;
        }

        h1 {
            color: #ff8c00;
            font-size: 30px;
            margin: 10px;
            animation: title 1.5s infinite alternate;
        }

        @keyframes title {
            from {
                color: #ff8c00;
            }

            to {
                color: #ff6f00;
            }
        }

        .subtitle {
            margin: 5px;
        }

        .stage {
            display: inline-block;
            background: #e3f2fd;
            color: #2196f3;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin: 10px;
        }

        .timer {
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }

        .bar-bg {
            width: 100%;
            height: 12px;
            background: #ddd;
            border-radius: 20px;
            margin: 8px 0;
            overflow: hidden;
        }

        #bar {
            height: 100%;
            width: 100%;
            background: #00a878;
            transition: 1s;
        }

        .status {
            display: flex;
            justify-content: space-between;
            padding: 8px 15px;
            font-weight: bold;
        }

        .score {
            color: #ff8c00;
        }

        .card {
            background: white;
            min-height: 400px;
            border-radius: 15px;
            padding: 30px 20px;
            margin-top: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #ff8c00;
            font-size: 25px;
        }

        .question {
            font-size: 18px;
            line-height: 1.6;
            margin: 25px 0;
        }

        input[type="text"] {
            width: 80%;
            padding: 13px;
            font-size: 17px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        input[type="text"]:focus {
            border-color: #2196f3;
            outline: none;
        }

        .option {
            display: block;
            width: 80%;
            margin: 8px auto;
            padding: 12px;
            text-align: left;
            background: #f4f7fb;
            border-radius: 8px;
            cursor: pointer;
        }

        .option:hover {
            background: #e3f2fd;
        }

        button {
            border: none;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .blue {
            background: #2196f3;
        }

        .purple {
            background: #7e57c2;
        }

        button:hover {
            transform: scale(1.05);
            background: #00a878;
        }

        /* Popup */

        #popup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .popup-box {
            background: #00a878;
            color: white;
            padding: 40px;
            border-radius: 20px;
            font-size: 28px;
            font-weight: bold;
            animation: pop 0.5s;
        }

        @keyframes pop {
            0% {
                transform: scale(0.3);
            }

            100% {
                transform: scale(1);
            }
        }

        .complete {
            padding-top: 50px;
        }

        .complete h2 {
            color: #00a878;
            font-size: 30px;
        }

        .final-score {
            color: #ff8c00;
            font-size: 28px;
            font-weight: bold;
            margin: 25px;
        }

        .gameover h2 {
            color: #e53935;
            font-size: 32px;
        }

        @media(max-width:600px) {

            .container {
                margin-top: 10px;
            }

            h1 {
                font-size: 25px;
            }

            .card {
                min-height: 420px;
            }

            input[type="text"],
            .option {
                width: 95%;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <h1>🏆 TREASURE HUNT</h1>

    <p class="subtitle">
        Competitive Skills • SET 1
    </p>

    <div class="stage" id="stage">
        🔎 CLUE 1
    </div>


    <!-- TIMER -->

    <div class="timer" id="timer">
        ⏱ Time: 40
    </div>

    <div class="bar-bg">
        <div id="bar"></div>
    </div>


    <!-- SCORE -->

    <div class="status">

        <div id="chances">
            ❤️ Chances Left: 2
        </div>

        <div class="score" id="score">
            ⭐ Score: 0
        </div>

    </div>


    <!-- GAME -->

    <div class="card" id="game">

    </div>

</div>


<!-- POINT POPUP -->

<div id="popup">

    <div class="popup-box">

        🎉<br>
        +10 POINTS!

    </div>

</div>


<script>

    // =========================
    // VARIABLES
    // =========================

    let score = 0;

    let chances = 2;

    let time = 40;

    let timer;


    // =========================
    // ELEMENTS
    // =========================

    const game =
        document.getElementById("game");

    const stage =
        document.getElementById("stage");

    const timerText =
        document.getElementById("timer");

    const bar =
        document.getElementById("bar");

    const chancesText =
        document.getElementById("chances");

    const scoreText =
        document.getElementById("score");

    const popup =
        document.getElementById("popup");


    // =========================
    // UPDATE STATUS
    // =========================

    function update() {

        chancesText.innerHTML =
            "❤️ Chances Left: " + chances;

        scoreText.innerHTML =
            "⭐ Score: " + score;
    }


    // =========================
    // SOUND
    // =========================

    function sound(type) {

        let audio =
            new AudioContext();

        let oscillator =
            audio.createOscillator();

        oscillator.connect(
            audio.destination
        );


        if (type === "correct") {

            oscillator.frequency.value =
                1000;

        } else {

            oscillator.frequency.value =
                400;
        }


        oscillator.start();

        oscillator.stop(
            audio.currentTime + 0.2
        );
    }


    // =========================
    // TIMER
    // =========================

    function startTimer() {

        clearInterval(timer);

        time = 40;

        updateTimer();


        timer = setInterval(function() {

            time--;

            updateTimer();


            if (time <= 0) {

                clearInterval(timer);

                gameOver(
                    "⏰ Time's Up!"
                );
            }

        }, 1000);
    }


    function updateTimer() {

        timerText.innerHTML =
            "⏱ Time: " + time;


        bar.style.width =
            (time / 40 * 100) + "%";


        if (time > 20) {

            bar.style.background =
                "#00a878";

            timerText.style.color =
                "#00a878";

        }

        else if (time > 10) {

            bar.style.background =
                "#ff9800";

            timerText.style.color =
                "#ff9800";

        }

        else {

            bar.style.background =
                "#e53935";

            timerText.style.color =
                "#e53935";
        }
    }


    // =========================
    // POINT POPUP
    // =========================

    function points(callback) {

        clearInterval(timer);

        popup.style.display =
            "flex";


        setTimeout(function() {

            popup.style.display =
                "none";

            callback();

        }, 1200);
    }


    // =========================
    // CLUE 1
    // =========================

    function clue1() {

        chances = 2;

        stage.innerHTML =
            "🔎 CLUE 1";

        update();


        game.innerHTML = `

            <h2>🗝️ TREASURE CLUE</h2>

            <div class="question">

                I am a place in your college<br>

                where students borrow books.

                <br><br>

                <b>What am I?</b>

            </div>


            <input
                type="text"
                id="answer"
                placeholder="Enter your answer"
            >


            <br>


            <button
                class="blue"
                onclick="checkClue()">

                🔓 SUBMIT ANSWER

            </button>

        `;


        startTimer();
    }


    // =========================
    // CHECK CLUE
    // =========================

    function checkClue() {

        let answer =
            document
            .getElementById("answer")
            .value
            .trim()
            .toLowerCase();


        if (answer === "library") {

            score += 10;

            update();

            sound("correct");

            points(quiz1);

        }

        else {

            chances--;

            update();

            sound("wrong");


            if (chances === 1) {

                alert(
                    "❌ Wrong Answer!\n\n" +
                    "You have 1 chance left."
                );

                document
                .getElementById("answer")
                .value = "";

            }

            else {

                gameOver(
                    "❌ You used both chances!"
                );
            }
        }
    }


    // =========================
    // QUIZ 1
    // =========================

    function quiz1() {

        chances = 2;

        stage.innerHTML =
            "🧠 QUIZ 1";

        update();


        game.innerHTML = `

            <h2>
                🧠 COMPETITIVE SKILLS
            </h2>


            <div class="question">

                How many sides does a hexagon have?

            </div>


            <label class="option">

                <input
                    type="radio"
                    name="answer"
                    value="5">

                5

            </label>


            <label class="option">

                <input
                    type="radio"
                    name="answer"
                    value="6">

                6

            </label>


            <label class="option">

                <input
                    type="radio"
                    name="answer"
                    value="7">

                7

            </label>


            <label class="option">

                <input
                    type="radio"
                    name="answer"
                    value="8">

                8

            </label>


            <button
                class="purple"
                onclick="checkQuiz()">

                🚀 SUBMIT ANSWER

            </button>

        `;


        startTimer();
    }


    // =========================
    // CHECK QUIZ
    // =========================

    function checkQuiz() {

        let selected =
            document.querySelector(
                'input[name="answer"]:checked'
            );


        if (!selected) {

            alert(
                "⚠️ Please select an answer."
            );

            return;
        }


        if (selected.value === "6") {

            score += 10;

            update();

            sound("correct");

            points(complete);

        }

        else {

            chances--;

            update();

            sound("wrong");


            if (chances === 1) {

                alert(
                    "❌ Wrong Answer!\n\n" +
                    "You have 1 chance left."
                );

            }

            else {

                gameOver(
                    "❌ You used both chances!"
                );
            }
        }
    }


    // =========================
    // COMPLETE
    // =========================

    function complete() {

        clearInterval(timer);

        stage.innerHTML =
            "🏆 SET 1 COMPLETE";


        game.innerHTML = `

            <div class="complete">

                <h2>
                    🎉 SET 1 COMPLETE!
                </h2>


                <p class="question">

                    You completed both<br>

                    Clue 1 and Quiz 1!

                </p>


                <div class="final-score">

                    ⭐ SET 1 SCORE

                    <br><br>

                    ${score} / 20

                </div>


                <p>

                    Clue 1 → +10 points

                    <br>

                    Quiz 1 → +10 points

                </p>


                <div class="stage">

                    SET 1 FINISHED

                </div>

            </div>

        `;


        timerText.innerHTML =
            "🎉 Completed!";

        bar.style.width =
            "100%";
    }


    // =========================
    // GAME OVER
    // =========================

    function gameOver(reason) {

        clearInterval(timer);

        stage.innerHTML =
            "💀 GAME OVER";


        game.innerHTML = `

            <div class="complete gameover">

                <h2>
                    💀 GAME OVER
                </h2>


                <p class="question">

                    ${reason}

                </p>


                <div class="final-score">

                    ⭐ SCORE

                    <br><br>

                    ${score} / 20

                </div>


                <p>

                    The game has ended.

                    <br><br>

                    Refresh the page to
                    play again.

                </p>

            </div>

        `;


        timerText.innerHTML =
            "⏱ Game Over";

        bar.style.width =
            "0%";
    }


    // =========================
    // START
    // =========================

    clue1();

</script>

</body>
</html>
```
